name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  CI:
    name: CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Validate
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval_Windows.zip
          Expand-Archive -Path pluginval_Windows.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate build-ci/Auralis_artefacts/VST3/Auralis.vst3
