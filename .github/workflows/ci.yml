name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  CI:
    name: CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Validate
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval_Windows.zip
          $expected = "C08E61CE3B96DB41636F8EC7E76F4C7E2C13EBDAC7FA1B5A1F52B4F32EC715AB"
          $actual = (Get-FileHash pluginval_Windows.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "pluginval zip hash mismatch: $actual" }
          Expand-Archive -Path pluginval_Windows.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate build-ci/Auralis_artefacts/VST3/Auralis.vst3

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path build-ci/Auralis_artefacts/VST3/Auralis.vst3 -DestinationPath Auralis-win64.zip
          (Get-FileHash Auralis-win64.zip -Algorithm SHA256).Hash | Out-File Auralis-win64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-win64
          path: |
            Auralis-win64.zip
            Auralis-win64.zip.sha256
